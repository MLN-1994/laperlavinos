name: Catalog Sync

on:
  schedule:
    - cron: '*/15 * * * *'  # Cada 15 minutos (UTC)
  workflow_dispatch:          # También permite correrlo manualmente desde GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger catalog sync
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://laperlavinos.vercel.app/api/admin/catalog-sync)
          echo "HTTP status: $response"
          if [ "$response" != "200" ]; then
            echo "Sync failed with status $response"
            exit 1
          fi
